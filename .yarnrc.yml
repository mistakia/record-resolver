nodeLinker: node-modules

# Supply-chain hardening: refuse dependency install lifecycle scripts. The
# global ~/.yarnrc.yml enableScripts:false does not carry into CI, so it must
# be set per-project. youtube-dl's postinstall (downloads the yt-dlp/youtube-dl
# binary the resolver depends on) is allowlisted via dependenciesMeta.built in
# package.json.
enableScripts: false

yarnPath: .yarn/releases/yarn-3.2.1.cjs
