name: Test

# The workflow name stays `Test`: signal auto-close in user-base matches a
# green run of this same workflow (extension/github-actions/lib/emit-failures.mjs).

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      # The Node test runs the committed dist/ under the engine floor.
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # No dependency lifecycle script runs: package.json carries an empty
      # trustedDependencies, and --ignore-scripts covers the root package too.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # The unit tests replay recorded output through a fake yt-dlp. This step
      # keeps the pinned release installable and its checksum honest.
      - name: Install pinned yt-dlp
        run: |
          bun cli/install-yt-dlp.ts "$RUNNER_TEMP/yt-dlp"
          "$RUNNER_TEMP/yt-dlp/yt-dlp" --version

      - name: Verify (lint, typecheck, dist is current)
        run: bun run verify

      # YTDLP_PATH lets test/yt-dlp-proxy.test.ts run the pinned release
      # through the guarded proxy, against loopback servers only.
      - name: Test
        env:
          YTDLP_PATH: ${{ runner.temp }}/yt-dlp/yt-dlp
        run: bun test
